<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A plataforma Angola para assistir filmes, séries, doramas e muito mais.">
    <title>KwanzaCine / Página Inicial</title>
    <link rel="icon" href="images/logo.png">
    
    <style>
        /* --- Reset e Variáveis --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-color: #0a080d;
            --card-bg: #141118;
            --accent-color: #00e5ff;
            --accent-hover: #00b3cc;
            --text-color: #ffffff;
            --text-muted: #a0a0aa;
            --warning-color: #ffb300; /* Tom de ouro/alerta elegante */
        }

        body {
            color: var(--text-color);
            background: linear-gradient(135deg, var(--bg-color) 60%, #002b3d 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Header --- */
        .headers {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 5%;
            background: rgba(10, 8, 13, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .headers p {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(45deg, #fff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .more {
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            order: -1;
        }

        .more:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .more img {
            width: 26px;
            height: auto;
        }

        /* --- Menu Lateral --- */
        .menu {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100vh;
            background: var(--card-bg);
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            padding: 6rem 2rem 2rem 2rem;
            transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 102;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .menu.active {
            left: 0;
        }

        .menu h2 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .menu a {
            display: block;
            color: var(--text-color);
            text-decoration: none;
            padding: 0.8rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .menu a:hover {
            background: rgba(0, 229, 255, 0.1);
            color: var(--accent-color);
            padding-left: 1.5rem;
        }

        /* --- Fundo Escuro (Overlay) --- */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 101;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .menu-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- Área de Conteúdo Principal --- */
        .main-content {
            margin-top: 100px;
            padding: 2rem 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Banner de Aviso de Transmissão --- */
        .notice-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            width: 100%;
            max-width: 1400px;
            padding: 1rem;
            margin-bottom: 2.5rem;
            background: rgba(255, 179, 0, 0.06);
            border: 1px solid rgba(255, 179, 0, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            text-align: center;
        }

        .notice-banner p {
            font-size: 1rem;
            font-weight: 500;
            color: #ffe082;
            letter-spacing: 0.3px;
        }

        /* Ícone de carregamento piscante */
        .notice-icon {
            width: 10px;
            height: 10px;
            background-color: var(--warning-color);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--warning-color);
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 15px var(--warning-color); }
            100% { opacity: 0.3; transform: scale(0.9); }
        }

        /* --- Grid de Players --- */
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 3rem;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .player-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .player-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
            padding-left: 4px;
            border-left: 3px solid var(--accent-color);
        }

        .videplayer {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 
                        0 0 20px rgba(0, 229, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .player-container:hover .videplayer {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 
                        0 0 30px rgba(0, 229, 255, 0.15);
            border-color: rgba(0, 229, 255, 0.2);
        }

        .videplayer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- Botão de Download --- */
        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            padding: 0.85rem 1.5rem;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .btn-download::before {
            content: "⬇";
            font-size: 1.1rem;
            transition: transform 0.3s ease;
        }

        .btn-download:hover {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            box-shadow: 0 8px 20px rgba(0, 229, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-download:hover::before {
            transform: translateY(2px);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        /* --- Responsividade --- */
        @media (max-width: 1024px) {
            .player-grid {
                grid-template-columns: 1fr;
                max-width: 800px;
            }
        }

        @media (max-width: 768px) {
            .headers p { font-size: 1.3rem; }
            .main-content { margin-top: 80px; padding: 1.5rem 1rem; }
            .notice-banner { margin-bottom: 1.8rem; padding: 0.8rem; }
            .notice-banner p { font-size: 0.9rem; }
            .player-grid { gap: 2rem; }
            .btn-download { padding: 0.75rem 1.2rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="menu-overlay" id="menuOverlay"></div>

<div class="headers" id="headers"> 
    <div class="more" id="menuBtn">
        <img src="images/white-menu.png" alt="Menu">
    </div>
    <p>KwanzaCine</p>
    <div style="width: 42px;"></div> 
</div>

<div class="menu" id="menu">
    <h2>Menu</h2>
    <a href="catalogo.html">Catálogo</a>
    <a href="about.html">Mais Sobre</a>
    <a href="portfolio.html">Quem Somos</a>
    <a href="contacto.html">Entre na nossa Comunidade</a>
    <a href="ajuda.html">Ajuda</a>
</div>

<div class="main-content">
    
    <div class="notice-banner">
        <span class="notice-icon"></span>
        <p>Aviso: Por favor, aguarde alguns segundos para a transmissão iniciar automaticamente.</p>
    </div>

    <div class="player-grid">
        
        <div class="player-container">
            <h3 class="player-title">ESPN Premium</h3>
            <div class="videplayer">
                <iframe src="https://nossoplayeronlinehd.ink/tv/espn" allowfullscreen></iframe>
            </div>
            <a href="catalogo.html" class="btn-download">Baixar Séries e Filmes</a>
        </div>

        <div class="player-container">
            <h3 class="player-title">SPORTV</h3>
            <div class="videplayer">
                <iframe src="https://nossoplayeronlinehd.ink/tv/sportv" allowfullscreen></iframe>
            </div>
            <a href="catalogo.html" class="btn-download">Baixar Séries e Filmes</a>
        </div>

        <div class="player-container">
            <h3 class="player-title">CazéTV</h3>
            <div class="videplayer">
               <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/sr6xQwwb4Oo?si=JpauBW6b5bsr9mn8" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            
        </div>
        <a href="catalogo.html" class="btn-download">Baixar Séries e Filmes</a>

    </div>
</div>

<script>
    const menuBtn = document.getElementById('menuBtn');
    const menu = document.getElementById('menu');
    const menuOverlay = document.getElementById('menuOverlay');

    function toggleMenu() {
        menu.classList.toggle('active');
        menuOverlay.classList.toggle('active');
    }

    menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleMenu();
    });

    menuOverlay.addEventListener('click', toggleMenu);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && menu.classList.contains('active')) {
            toggleMenu();
        }
    });
</script>

</body>
</html>
